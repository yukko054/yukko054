name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#fcee0a&color_dots=#161b22,#3b0a45,#7a0f5c,#c2185b,#ff003c
            dist/snake-light.svg?color_snake=#ff003c&color_dots=#ebedf0,#b3f5ff,#00f0ff,#c2185b,#ff003c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
